<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ShopSmart</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
<h1>ShopSmart</h1>
        <form>
            <input type="search" placeholder="Search products...">
            <button type="submit">Search</button>
        </form>
        <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart</a>
</nav>
         </header>
    <main>
        <section class="hero" id="home">
       <h2>Welcome to ShopSmart</h2>
          <p>
                Find the best products at affordable prices.
            </p>
        <a href="#products">
                <button type="button">Shop Now</button>
            </a>
      </section>
        <section class="categories">
       <h2>Shop by Category</h2>
            <div class="category-container">
              <button type="button">Electronics</button>
                <button type="button">Fashion</button>
                <button type="button">Shoes</button>
                <button type="button">Accessories</button>
           </div>
      </section>
        <section class="featured-products" id="products">
           <h2>Featured Products</h2>
           <div class="product-container" id="productContainer">
            </div>
         </section>
          <section class="cta">
           <h2>Ready to Shop?</h2>
       <p>
                Explore our collection and find something you love.
            </p>
               <a href="#products">
                <button type="button">Explore Products</button>
            </a>
        </section>
        
<section class="cart-section" id="cart">
    <h2>Shopping Cart</h2>

    <div id="cartContainer">
        <p>Your cart is empty.</p>
    </div>

    <p class="cart-total">
        Total: ₹<span id="cartTotal">0</span>
    </p>
</section>

</main>

    <footer>
            <p>
            &copy; 2026 ShopSmart. All rights reserved.
        </p>
</footer>
<script src="./script.js" defer></script>
</body>
</html>
